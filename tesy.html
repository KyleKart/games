<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ElmoBear's Games</title>
    <meta content="ElmoBear's Games" property="og:title">
    <meta content="Games that I have made which I am proud of or happy with!" property="og:description">

    <style>
        :root { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: light dark; }
        body { background-color: #1f1f1f; color: #ccc; margin: 0; padding: 20px; }
        h1 { margin: 16px 0; }
        h2, h3, p { margin: 8px 0; }

        .section { max-width: 928px; margin: 24px auto; text-align: center; }
        .header h1 { font-size: 2.5em; display: flex; align-items: center; justify-content: center; font-weight: normal; }
        
        .search-bar { margin-bottom: 20px; text-align: center; }
        .search-bar input { padding: 10px; font-size: 16px; width: 300px; border: 5px solid #1f1f1f7c; border-radius: 8px; background-color: rgb(45 45 45); color: #ccc; }

        .games {
            display: -ms-grid;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            margin: 16px -4px;
        }

        .game-description {
            position: relative;
            border-radius: 8px;
            border: 5px solid #1f1f1f7c;
            margin: 4px;
            padding: 6px;
            background-color: rgb(45, 45, 45);
            height: 200px;
            max-height: 150px;
            overflow: hidden;
        }

        #game-item {
            border: 5px solid #1f1f1f7c;
            border-radius: 16px;
            margin: 4px;
            overflow: hidden;
            padding: 8px;
        }

        footer { opacity: 0.8; width: 100%; text-align: center; margin-bottom: 16px; }
        a { text-decoration: none; color: inherit; }
        p { display: block; margin-block-start: 1em; margin-block-end: 1em; }
    </style>
</head>
<body>

<div class="section header">
    <h1>ElmoBear's Games</h1>
    <p>Various games that I've made. Most made in some form of a Scratch mod.</p>
    <p>These are playable directly in the browser. Mobile support not intentional if present.</p>
</div>

<div class="search-bar">
    <input type="text" id="search-input" placeholder="Search games..." oninput="filterGames()">
</div>

<div class="section games-outer">
    <div class="games">
        <a href="YOUR_LINK_HERE">
            <div id="game-item">
                <div class="game-description">
                    <h3>Game Title</h3>
                    <p>Description goes here.</p>
                </div>
            </div>
        </a>
    </div>
</div>

<script>
    function filterGames() {
        let searchInput = document.getElementById('search-input').value.toLowerCase();
        let games = document.querySelectorAll('.games a');
        games.forEach(function (game) {
            let title = game.querySelector('h3').textContent.toLowerCase();
            let description = game.querySelector('p').textContent.toLowerCase();
            let matchesSearch = title.includes(searchInput) || description.includes(searchInput);
            game.style.display = matchesSearch ? '' : 'none';
        });
    }
</script>

</body>
</html>
