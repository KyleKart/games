<!DOCTYPE html>
<html>
<head>
    <title>ElmoBear's Games</title>
    <style>
        :root { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: light dark; }
        body { background-color: #1f1f1f; color: #ccc; margin: 0; padding: 20px; }
        .section { max-width: 928px; margin: 24px auto; text-align: center; }
        
        .search-bar { margin-bottom: 20px; text-align: center; }
        .search-bar input { padding: 10px; font-size: 16px; width: 300px; border: 5px solid #1f1f1f7c; border-radius: 8px; background-color: rgb(45 45 45); color: #ccc; }

        .game-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 16px -4px; }
        
        .game-item {
            border: 5px solid #1f1f1f7c;
            border-radius: 16px;
            margin: 4px;
            padding: 16px;
            background-color: rgb(37, 37, 37);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h3, p { margin: 8px 0; }
        a { text-decoration: none; color: inherit; }
        .play-link { display: block; margin-top: 15px; padding: 8px; border: 2px solid #555; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="section">
    <h1>ElmoBear's Games</h1>

    <div class="search-bar">
        <input type="text" id="search-input" onkeyup="filterGames()" placeholder="Search games...">
    </div>

    <div class="game-grid" id="game-list">
        <div class="game-item">
            <h3>Game Name</h3>
            <p>A short description of your game.</p>
            <a href="LINK_HERE" class="play-link">Play</a>
        </div>
    </div>
</div>

<script>
  function filterGames() {
    let input = document.getElementById('search-input').value.toLowerCase();
    let games = document.querySelectorAll('.game-item');

    games.forEach(function (game) {
      let text = game.textContent.toLowerCase();
      game.style.display = text.includes(input) ? "" : "none";
    });
  }
</script>

</body>
</html>
